name: 构建 macOS 应用

# =============================================================================
#  用 GitHub 的免费 macOS 真机把本工程打包成自包含的 .app
#
#  这是绕过「PyInstaller 不支持交叉编译」的唯一可靠办法：
#  你全程在 Windows 上操作，构建发生在 GitHub 托管的 macOS 机器上。
#
#  用法：
#    1) 仓库根目录结构要求：
#         你的仓库/
#         ├── .github/workflows/build-macos.yml   ← 本文件
#         └── novel_publisher_mac/                ← 整个源码文件夹
#    2) 仓库 Actions 页 → 左侧「构建 macOS 应用」→ Run workflow → 选 arm64
#    3) 等 5-10 分钟，在该次运行的 Artifacts 区下载 zip
#
#  注意：arch 一律通过 github.event.inputs.arch 读取。
#  不能写成 inputs.arch —— 那个 context 只在 workflow_dispatch 下存在，
#  push 触发时会直接报 Unrecognized named-value: 'inputs'。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构（Apple Silicon 选 arm64，Intel 老机器选 x86_64）'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x86_64
  push:
    branches: [main, master]
    paths:
      - 'novel_publisher_mac/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  build:
    name: 打包 ${{ github.event.inputs.arch || 'arm64' }}
    # macos-14 = Apple Silicon(M1)；macos-13 = Intel
    runs-on: ${{ github.event.inputs.arch == 'x86_64' && 'macos-13' || 'macos-14' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: novel_publisher_mac

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 准备解释器（确保带 tkinter，并建独立 venv）
        run: |
          set -eux
          BASE="$(command -v python3.10)"
          if python3.10 -c 'import tkinter, tkinter.TkVersion' 2>/dev/null; then
            echo "setup-python 的构建自带 tkinter"
          else
            echo "setup-python 的构建不含 tkinter，改装 Homebrew 版"
            brew install python@3.10 python-tk@3.10
            BASE="$(brew --prefix)/opt/python@3.10/bin/python3.10"
          fi
          test -x "$BASE"
          "$BASE" -V
          "$BASE" -c 'import tkinter; print("tk", tkinter.TkVersion)'

          # 关键：Homebrew 的 python 被标为 externally-managed，直接 pip install
          # 会被 PEP 668 拒绝（error: externally-managed-environment）。
          # 用 venv 绕过 —— venv 不受该策略管辖。
          VENV="$RUNNER_TEMP/build-venv"
          "$BASE" -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "PYTHON=$VENV/bin/python" >> "$GITHUB_ENV"
          "$VENV/bin/python" -V
          "$VENV/bin/python" -c 'import tkinter; print("venv 内 tkinter OK")'

      - name: 环境自检
        run: |
          set -eux
          PY="${PYTHON:-python3.10}"
          uname -m
          sw_vers
          $PY -V
          $PY -c 'import sys, tkinter; print("解释器:", sys.executable); print("tkinter OK")'

      - name: 生成应用图标
        run: |
          set -eux
          PY="${PYTHON:-python3.10}"
          $PY -m pip install --quiet pillow
          # 先用 Python 手工构造一份 icns —— 保证无论如何都有图标
          $PY gen_icns.py assets/app_icon.png assets/app.icns
          # 再用 macOS 原生工具重做一份，Retina 下效果更好
          ( cd assets && bash make_icns.sh ) || echo "sips/iconutil 未生效，沿用 Python 生成的版本"
          ls -l assets/app.icns

      - name: 安装依赖
        run: |
          set -eux
          PY="${PYTHON:-python3.10}"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements-mac.txt

      - name: 业务自检（不过就不打包）
        run: |
          set -eux
          PY="${PYTHON:-python3.10}"
          $PY selftest_business.py

      - name: PyInstaller 打包
        env:
          TARGET_ARCH: ${{ github.event.inputs.arch || 'arm64' }}
        run: |
          set -eux
          PY="${PYTHON:-python3.10}"
          rm -rf build dist
          $PY -m PyInstaller --noconfirm --clean --log-level=INFO novel_publisher_mac.spec
          ls -la dist/

      - name: 修权限 + 签名（有开发者证书则正式签名，否则 ad-hoc）
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # 刻意不用 set -x：本步骤会接触证书内容，
          # 开启命令回显会把 base64 证书打进 CI 日志。
          set -eu
          APP="dist/寒山小说发布工具.app"
          test -d "$APP"

          # 1) 先修 node 可执行位。必须在签名之前做 ——
          #    改动包内任何文件都会让已有签名失效。
          NODE="$(find "$APP" -type f -name node -path '*playwright/driver*' | head -1 || true)"
          if [ -n "$NODE" ]; then
            chmod +x "$NODE"
            echo "已恢复 node 可执行位: $NODE"
          else
            echo "::warning::包内未找到 playwright/driver/node，首次运行可能需要联网"
          fi

          # 2) 签名
          if [ -n "${MACOS_CERT_P12:-}" ] && [ -n "${MACOS_CERT_PASSWORD:-}" ]; then
            echo "检测到开发者证书，使用 Developer ID 正式签名"
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASS="$(openssl rand -hex 32)"
            CERT_B64="$RUNNER_TEMP/cert.b64"
            CERT_P12="$RUNNER_TEMP/cert.p12"

            printf '%s' "$MACOS_CERT_P12" > "$CERT_B64"
            openssl base64 -d -A -in "$CERT_B64" -out "$CERT_P12"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security import "$CERT_P12" -k "$KEYCHAIN" \
              -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: \
              -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" \
              $(security list-keychains -d user | tr -d '"')

            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | grep 'Developer ID Application' | head -1 \
              | sed 's/.*"\(.*\)"/\1/')"
            test -n "$IDENTITY" || { echo "::error::keychain 里没找到 Developer ID Application 证书"; exit 1; }
            echo "签名身份: $IDENTITY"

            # 公证要求 hardened runtime + 安全时间戳
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"

            rm -f "$CERT_B64" "$CERT_P12"
          else
            echo "未配置开发者证书，使用 ad-hoc 签名（本机可运行，分发会被 Gatekeeper 拦截）"
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -5 || true
          du -sh "$APP"

      - name: 公证（有 Apple 凭据且已正式签名时才执行）
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          set -eu
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_APP_PASSWORD:-}" ]; then
            echo "未配置 Apple ID / Team ID / App 专用密码，跳过公证。"
            echo "未公证的 .app 首次打开会被 Gatekeeper 拦截，解法见仓库 README。"
            exit 0
          fi
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "::warning::配置了 Apple 凭据但没有签名证书；公证需要两者同时具备，跳过。"
            exit 0
          fi

          APP="dist/寒山小说发布工具.app"
          ZIP_FOR_NOTARY="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP_FOR_NOTARY"

          echo "提交公证（通常 1-5 分钟）…"
          xcrun notarytool submit "$ZIP_FOR_NOTARY" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          echo "装订公证票据…"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP" || true
          rm -f "$ZIP_FOR_NOTARY"

      - name: 打包成可下载的 zip
        run: |
          set -eux
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          # 必须用 ditto：普通 zip 会破坏 .app 内的符号链接与权限位，
          # 解压出来的 .app 会直接打不开。
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/寒山小说发布工具.app" \
            "dist/寒山小说发布工具-macOS-${ARCH}.zip"

          # 附一份解除 Gatekeeper 拦截的说明，省得用户去翻 README
          cat > "dist/首次打开被拦截怎么办.txt" <<'TXTEOF'
          如果 macOS 提示「Apple 无法验证"寒山小说发布工具"是否包含可能危害
          Mac 安全或泄漏隐私的恶意软件」，这是未公证软件的正常提示，
          不是文件损坏。三种解法：

          【解法一】命令行 —— 最快，所有 macOS 版本都有效
            打开「终端」，粘贴下面一行后回车：
              xattr -dr com.apple.quarantine ~/Downloads/寒山小说发布工具.app
            路径按实际位置改。不确定路径时，敲到 quarantine 后面留一个空格，
            再把 .app 从访达拖进终端窗口，路径会自动补全，然后回车。

          【解法二】右键打开
            macOS 14 Sonoma 及更早：右键 App → 打开 → 弹框里再点「打开」
            macOS 15 Sequoia 及更新：Apple 已移除右键打开绕过，改用解法三

          【解法三】系统设置
            先双击 App 让它弹一次拦截，然后打开：
            系统设置 → 隐私与安全性 → 往下滚到「安全性」
            → 找到被拦的 App → 点「仍要打开」→ 输入密码确认

          彻底解决需要 Apple 开发者账号（$99/年）做签名 + 公证，
          之后任何人打开都不会再被拦，详见仓库 README。
          TXTEOF

          ls -lh dist/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 寒山小说发布工具-macOS-${{ github.event.inputs.arch || 'arm64' }}
          path: novel_publisher_mac/dist/*.zip
          retention-days: 30

      - name: 失败时打印诊断
        if: failure()
        run: |
          echo "::group::spec 输出"
          find . -name 'warn-*.txt' -maxdepth 2 -exec cat {} \; || true
          echo "::endgroup::"
          echo "::group::dist 目录"
          ls -laR dist 2>/dev/null | head -80 || echo "dist 不存在"
          echo "::endgroup::"
