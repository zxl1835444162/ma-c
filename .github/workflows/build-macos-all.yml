name: 构建 macOS 应用（多 Python/Tk 版本 + 启动自检）

# =============================================================================
#  为什么会有这个版本的工作流
# =============================================================================
#  【已定位的真正根因】不是 Tk 版本，是启动钩子把 NSApp 顶掉了。
#
#  实测崩溃（macOS 15.6）：
#      NSInvalidArgumentException,
#      reason: '-[NSApplication macOSVersion]: unrecognized selector sent to instance'
#        TkSetMacColor → Tk_GetColor → Tk_Get3DBorder → Tk_InitOptions
#        → TkCreateFrame → Tk_Init → Tkinter_TkInit → Tkapp_New
#        libc++abi: terminating due to uncaught exception of type NSException
#
#  Tk 的 macOS 实现把 `macOSVersion` 等方法加在自己的 NSApplication 子类
#  `TKApplication` 上，并期望 `NSApp` 就是 `TKApplication`。
#  而 `novel_publisher_mac/rthook_frozen_macos.py` 以前在 **Tk 之前**调用了
#  `NSApplication.sharedApplication()`，AppKit 于是抢先创建了一个普通
#  NSApplication 并把它设为全局单例，Tk 之后换不回来 —— 一取色就崩。
#
#  这解释了全部现象：浅色深色都崩、换 Tcl/Tk 版本也没用、
#  原作者本机「测试通过」（旧版 macOS 的 Tk 还没开始调 macOSVersion）。
#
#  修复：钩子里彻底不再碰 AppKit；前台激活挪到 Tk 建好之后
#  （`macos_support.apply_darwin_tk_defaults`，那里本来就是正确时机）。
#
#  ---------------------------------------------------------------------------
#  顺带保留的价值
#  · 仍然用 py3.13 而不是 3.10 —— 3.10 的 macOS 安装包 python.org 早已停发，
#    自带的 Tcl/Tk 被永久冻结，是条死路。
#  · 仍然构建两个架构，并且**真的把 .app 跑起来验证**（浅色 + 深色各一次），
#    结论写进 artifact 名字：`可用-自检通过-…` / `启动失败-勿下载-…`。
#    ——正是这道自检在上一轮把上面那个崩溃栈原样打了出来。
#
#  用法：Actions 页 → Run workflow（不用填参数）
#        → 等 15-30 分钟 → 下载名字带「可用」且架构匹配你 Mac 的那个
# =============================================================================

on:
  # 不要加 workflow_dispatch 的 inputs 再拼矩阵表达式 —— 表达式写错会让整个
  # 工作流根本起不来。这里就用静态矩阵，改版本直接改下面那行。
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'novel_publisher_mac/**'
      - '.github/workflows/build-macos-all.yml'

permissions:
  contents: read

jobs:
  build:
    name: py${{ matrix.pyver }} · ${{ matrix.arch }}
    runs-on: macos-14          # Apple Silicon(M1) 真机，同时交叉产出 x86_64
    timeout-minutes: 60
    # x86_64 是在 arm64 runner 上交叉瘦身产出的，个别第三方轮的切片问题可能让它失败。
    # 标记为「允许失败」，不把整个运行拖红 —— 你的 Mac 若是 Apple Silicon 根本用不上它。
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        # 只构建 3.13：Python 3.10 的 macOS 安装包 python.org 早已停发，
        # 它自带的 Tcl/Tk 被永久冻结在旧版本，是条死路（留作对照组只会制造噪音）。
        pyver: ['3.13']
    defaults:
      run:
        working-directory: novel_publisher_mac

    env:
      TARGET_ARCH: ${{ matrix.arch }}
      PY_MINOR: ${{ matrix.pyver }}
      PY_ROOT: /Library/Frameworks/Python.framework/Versions/${{ matrix.pyver }}

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      - name: 安装 python.org 官方 universal2 Python ${{ matrix.pyver }}
        run: |
          set -eux
          echo "runner: $(uname -m) / macOS $(sw_vers -productVersion) / 目标 $TARGET_ARCH / Python $PY_MINOR"

          # 从 python.org 目录列表里解析出该次版本号下最新的补丁版本
          BASE="https://www.python.org/ftp/python"
          VER="$(curl -fsSL --retry 3 "$BASE/" | tr '"' '\n' \
                 | grep -E "^${PY_MINOR//./\\.}\.[0-9]+/?$" | tr -d '/' | sort -uV | tail -1)"
          test -n "$VER" || { echo "::error::在 python.org 上找不到 $PY_MINOR 系列的版本"; exit 1; }
          echo "解析到版本: $VER"

          DIR="$BASE/$VER/"
          PKGLIST="$(curl -fsSL --retry 3 "$DIR" | tr '"' '\n' | grep -E '^python-.+\.pkg$' | grep -v -i dev || true)"
          # 优先 universal2（macos11.pkg），它同时含 x86_64 + arm64 切片，
          # 才能在 arm64 构建机上交叉产出 x86_64 的包
          PKG="$(printf '%s\n' "$PKGLIST" | grep -i 'macos11' | head -1)"
          [ -n "$PKG" ] || PKG="$(printf '%s\n' "$PKGLIST" | grep -i 'macos' | head -1)"
          [ -n "$PKG" ] || { echo "::error::$DIR 下没找到 .pkg 安装包"; exit 1; }
          echo "使用安装包: $PKG"

          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/py.pkg" "$DIR$PKG"
          sudo installer -pkg "$RUNNER_TEMP/py.pkg" -target / > /dev/null

          PY="$PY_ROOT/bin/python${PY_MINOR}"
          test -x "$PY" || { echo "::error::安装后找不到 $PY"; ls -l "$PY_ROOT/bin" || true; exit 1; }
          "$PY" -V

          # 解释器必须同时含目标架构的切片
          echo "解释器架构: $(lipo -archs "$PY")"
          if ! lipo -archs "$PY" | tr ' ' '\n' | grep -qx "$TARGET_ARCH"; then
            echo "::error::$PY 不含 $TARGET_ARCH 切片，无法产出该架构的包"
            exit 1
          fi

          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "PY_FULL_VER=$VER" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      - name: 记录这一套自带的 Tcl/Tk 版本
        run: |
          set -eux
          "$PY" - <<'PYCODE'
          import tkinter
          print(f"Python {tkinter.TkVersion} / 解释器内建 Tk = {tkinter.TkVersion}")
          print(f"python.org 的 Python 自带私有 Tcl/Tk，不会去用系统那份")
          PYCODE
          # 直接读 dylib 里的版本字符串，最可靠
          LIBDIR="$(dirname "$PY")/../lib"
          for f in "$LIBDIR"/libtk8.6.dylib "$LIBDIR"/libtk9.0.dylib; do
            [ -f "$f" ] || continue
            echo "--- $(basename "$f") ---"
            strings "$f" | grep -m3 -E '^8\.6\.[0-9]+$|^9\.0\.[0-9]+$' || true
          done

      # ---------------------------------------------------------------------
      - name: 建 venv 并安装依赖
        run: |
          set -eux
          VENV="$RUNNER_TEMP/venv-$PY_MINOR-$TARGET_ARCH"
          "$PY" -m venv "$VENV"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
          "$VENV/bin/python" -m pip install --quiet -r requirements-mac.txt

          "$VENV/bin/python" - <<'PYCODE'
          import tkinter, playwright.sync_api, pystray, PIL, requests
          import lxml, parsel, AppKit, Foundation
          print("运行期依赖全部可导入（含 tkinter / playwright / pyobjc 托盘后端）")
          PYCODE

          "$VENV/bin/python" -m PyInstaller --version
          echo "VPY=$VENV/bin/python" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      - name: 生成应用图标
        run: |
          set -eux
          [ -f assets/app.icns ] || bash assets/make_icns.sh
          ls -l assets/app.icns

      # ---------------------------------------------------------------------
      - name: 业务自检（仅提示，不阻断 —— 换 Python 版本可能影响断言）
        continue-on-error: true
        run: |
          set -eux
          "$VPY" selftest_business.py

      # ---------------------------------------------------------------------
      - name: PyInstaller 打包
        run: |
          set -eux
          rm -rf build dist
          "$VPY" -m PyInstaller --noconfirm --clean --log-level=WARN novel_publisher_mac.spec

          APP="dist/寒山小说发布工具.app"
          test -d "$APP"
          BIN="$APP/Contents/MacOS/寒山小说发布工具"
          test -f "$BIN"
          echo "主程序架构: $(lipo -archs "$BIN")"
          du -sh "$APP"

      # ---------------------------------------------------------------------
      - name: 修权限 + 签名 + 依赖扫描
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # 刻意不开 set -x：本步会碰证书内容
          set -eu
          APP="dist/寒山小说发布工具.app"

          NODE="$(find "$APP" -type f -name node -path '*playwright/driver*' | head -1 || true)"
          if [ -n "$NODE" ]; then
            chmod +x "$NODE"
            echo "已恢复 node 可执行位: $NODE ($(du -h "$NODE" | cut -f1))"
          else
            echo "::warning::包内未找到 playwright/driver/node，首次运行需要联网"
          fi

          echo "== 扫描构建机私有路径依赖 =="
          BAD=0
          while IFS= read -r f; do
            case "$f" in
              *.so|*.dylib|*/MacOS/*)
                if otool -L "$f" 2>/dev/null | grep -qE '(/opt/homebrew|/usr/local/opt|/Users/runner)'; then
                  echo "::error file=$f::残留构建机路径依赖："
                  otool -L "$f" | grep -E '(/opt/homebrew|/usr/local/opt|/Users/runner)' || true
                  BAD=1
                fi
                ;;
            esac
          done < <(find "$APP/Contents/Frameworks" "$APP/Contents/MacOS" -type f 2>/dev/null | head -400)
          [ "$BAD" = "0" ] || { echo "::error::包内存在构建机私有路径，拿到别的 Mac 上必然起不来"; exit 1; }
          echo "未发现私有路径依赖"

          if [ -n "${MACOS_CERT_P12:-}" ] && [ -n "${MACOS_CERT_PASSWORD:-}" ]; then
            echo "检测到开发者证书，使用 Developer ID 正式签名"
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASS="$(openssl rand -hex 32)"
            printf '%s' "$MACOS_CERT_P12" > "$RUNNER_TEMP/cert.b64"
            openssl base64 -d -A -in "$RUNNER_TEMP/cert.b64" -out "$RUNNER_TEMP/cert.p12"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: \
              -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" \
              $(security list-keychains -d user | tr -d '"')

            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')"
            test -n "$IDENTITY" || { echo "::error::keychain 里没有 Developer ID Application 证书"; exit 1; }
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
            rm -f "$RUNNER_TEMP/cert.b64" "$RUNNER_TEMP/cert.p12"
          else
            echo "ad-hoc 签名（首次打开会被 Gatekeeper 拦一次，属正常）"
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"

      # ---------------------------------------------------------------------
      #  启动自检：本工作流的核心。不通过不会让整个运行变红，
      #  但会把结论写进 artifact 名字和包内的结果文件 —— 一眼看出哪套能用。
      # ---------------------------------------------------------------------
      - name: 启动自检（浅色 + 深色）
        id: smoke
        run: |
          set -eu
          APP="dist/寒山小说发布工具.app"
          BIN="$APP/Contents/MacOS/寒山小说发布工具"
          APPDIR="$HOME/Library/Application Support/寒山小说发布工具"
          SUMMARY="$RUNNER_TEMP/smoke-summary.txt"
          : > "$SUMMARY"

          PREFIX=""
          if [ "$TARGET_ARCH" != "$(uname -m)" ]; then
            if arch -x86_64 /usr/bin/true > /dev/null 2>&1; then
              PREFIX="arch -x86_64"
            else
              echo "::warning::runner 无 Rosetta，跳过 $TARGET_ARCH 启动自检"
              echo "verdict=未验证-无Rosetta" >> "$GITHUB_OUTPUT"
              echo "未能自检：runner 无 Rosetta" >> "$SUMMARY"
              exit 0
            fi
          fi

          FAILED=""
          smoke() {
            label="$1"; tag="$2"
            log="$RUNNER_TEMP/launch-$PY_MINOR-$TARGET_ARCH-$tag.log"
            rm -rf "$APPDIR" || true
            echo "── 启动自检：$label ──" | tee -a "$SUMMARY"
            set +e
            $PREFIX "$BIN" > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 1 20); do sleep 1; kill -0 "$pid" 2> /dev/null || break; done
            if kill -0 "$pid" 2> /dev/null; then
              echo "  ✓ 存活 20 秒" | tee -a "$SUMMARY"
              kill "$pid" 2> /dev/null; wait "$pid" 2> /dev/null
              set -e
              return 0
            fi
            wait "$pid" 2> /dev/null
            set -e
            echo "  ✗ 启动即退出" | tee -a "$SUMMARY"
            FAILED="$label"
            # 同时打到 CI 日志和结果文件里 —— 只写文件的话，出问题时在
            # Actions 页面上什么都看不到，还得先下载 60MB 的产物才知道原因。
            {
              echo "---------------- $label 启动输出 ----------------"
              cat "$log" || true
              echo "-------------------------------------------------"
            } 2>&1 | tee -a "$SUMMARY"
            if grep -q 'TkpGetColor' "$log" 2> /dev/null; then
              echo "命中 Tk 取色崩溃（TkpGetColor → NSException）" | tee -a "$SUMMARY"
            fi
            return 1
          }

          smoke "浅色外观" light || true

          if osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' > /dev/null 2>&1; then
            sleep 3
            smoke "深色外观" dark || true
            osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false' > /dev/null 2>&1 || true
          fi

          if [ -z "$FAILED" ]; then
            echo "verdict=可用-自检通过" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=启动失败-勿下载" >> "$GITHUB_OUTPUT"
            echo "::warning::py$PY_MINOR / $TARGET_ARCH 这套启动失败，artifact 名字会带「启动失败」"
          fi

      # ---------------------------------------------------------------------
      - name: 公证（配了 Apple 凭据且已正式签名时才执行）
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          set -eu
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_APP_PASSWORD:-}" ]; then
            echo "未配置 Apple 凭据，跳过公证"; exit 0
          fi
          [ -n "${MACOS_CERT_P12:-}" ] || { echo "::warning::有凭据无证书，跳过"; exit 0; }

          APP="dist/寒山小说发布工具.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      # ---------------------------------------------------------------------
      - name: 组装安装包（App + 说明 + 修复/诊断脚本）
        run: |
          set -eux
          APP="dist/寒山小说发布工具.app"
          TAG="py${PY_MINOR}-${TARGET_ARCH}"
          STAGE="dist/寒山小说发布工具-${TAG}"
          rm -rf "$STAGE"; mkdir -p "$STAGE"

          # 必须用 ditto：普通 zip 会破坏 .app 内的符号链接与权限位
          ditto "$APP" "$STAGE/寒山小说发布工具.app"

          if [ -f ../一键修复.command ]; then
            cp ../一键修复.command "$STAGE/① 先双击我-修复并打开.command"
            chmod +x "$STAGE/① 先双击我-修复并打开.command"
          fi
          if [ -f ../诊断.command ]; then
            cp ../诊断.command "$STAGE/② 打不开就双击我-诊断.command"
            chmod +x "$STAGE/② 打不开就双击我-诊断.command"
          fi
          cp ../MAC小白操作手册.md "$STAGE/③ 使用前必读-小白操作手册.md" 2>/dev/null || true

          cat > "$STAGE/先看我.txt" <<TXTEOF
          寒山小说发布工具 · macOS 版
          构建组合：Python ${PY_MINOR} / ${TARGET_ARCH}
          启动自检：${{ steps.smoke.outputs.verdict }}

          文件怎么用：
            ① 先双击我-修复并打开.command
               先双击它。会自动清掉 macOS 拦截标记、关掉可能崩窗口的深色模式、
               再打开应用。第一次双击若被拦：右键 → 打开 → 再点「打开」。
            ② 打不开就双击我-诊断.command
               ① 没成功就双击这个，它会把真实原因打印出来并自动存到桌面成文件。
            ③ 使用前必读-小白操作手册.md
               不会用 Mac 就看这个。

          寒山小说发布工具.app
               应用本体。也可以直接双击它试试。
          TXTEOF

          cp "$RUNNER_TEMP/smoke-summary.txt" "$STAGE/启动自检结果.txt" 2>/dev/null || true

          rm -f "dist/寒山小说发布工具-${TAG}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "dist/寒山小说发布工具-${TAG}.zip"
          rm -rf "$STAGE"
          ls -lh dist/

      # ---------------------------------------------------------------------
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.smoke.outputs.verdict || '未验证' }}-${{ matrix.pyver }}-${{ matrix.arch }}
          path: novel_publisher_mac/dist/寒山小说发布工具-py${{ matrix.pyver }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      - name: 失败时打印诊断
        if: failure()
        run: |
          echo "::group::spec 警告"
          find . -name 'warn-*.txt' -maxdepth 2 -exec cat {} \; || true
          echo "::endgroup::"
          echo "::group::dist"
          ls -laR dist 2> /dev/null | head -60 || echo "dist 不存在"
          echo "::endgroup::"
          echo "::group::启动日志"
          cat "$RUNNER_TEMP"/launch-*.log 2> /dev/null | head -160 || true
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      - name: 汇总
        if: always()
        run: |
          {
            echo "## py${{ matrix.pyver }} / ${{ matrix.arch }}"
            echo ""
            echo "- 启动自检：**${{ steps.smoke.outputs.verdict }}**"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/smoke-summary.txt" 2> /dev/null || echo "（无自检输出）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
